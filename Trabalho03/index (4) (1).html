<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
   <main class="container my-4">
        <div class="border p-4 bg white shadow-sm">
            <form >
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nomeAluno" class="form-label">Nome Fantasia ou primeiro nome</label>
                        <input type="text" class="form-control" id="nomeFantasia" placeholder="Digite o nome aqui">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label d-block">Pessoa</label>
                        <div class="form-ckeeck form check-inline">
                            <input class="form-check-input" type="radio" name="pessoa" id="pessoaFisica" value="fisica" >
                            <label class="form-check-label" for="pessoaFisica">Fisica</label> 
                        </div>
                        <div class="form-ckeeck form check-inline">
                            <input class="form-check-input" type="radio" name="pessoa" id="pessoaJuridica" value="juridica" >
                            <label class="form-check-label" for="pessoaFisica">Juridica</label> 
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-8">
                            <label for="razao" class="form-label">Razao</label>
                            <input type="text" class="form-control" id="razao" name="razao">
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-4">
                            <label for="cnpj" class="form-label">CNPJ</label>
                            <input type="text" class="form-control" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00">
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-8">
                            <label for="endereco" class="form-label">Endereço</label>
                            <input type="text" class="form-control" id="endereco" name="endereco">
                        </div>
                        <div class="col-md-4">
                            <label for="bairro" class="form-label">Bairro</label>
                            <input type="text" class="form-control" id="bairro" name="bairro">
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-8">
                            <label for="cidade" class="form-label">Cidade</label>
                            <input type="text" class="form-control" id="cidade" name="cidade">
                        </div>
                        <div class="col-md-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" name="estado">
                                <option selected>Minas Gerais</option>
                                <option value="SP">Sao paulo</option>
                                <option value="RJ">Rio de janeiro</option>
                                <option value="ES">Espirito Santo</option>
                                <option value="BA">Bahia</option>
                            </select>                                
                        </div>
                        <div class="col-md-3">
                            <label for="cep" class="form-label">CEP</label>
                            <input type="text" class="form-control" id="cep" name="cep" placeholder="00000-00">    
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-4">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="tel" class="form-control" id="telefone" name="telefone">
                        </div>
                        <div class="col-md-4">
                            <label for="celular" class="form-label">Celular</label>
                            <input type="tel" class="form-control" id="celular" name="celular">
                        </div> <div class="col-md-4">
                            <label for="fax" class="form-label">Fax</label>
                            <input type="tel" class="form-control" id="celular" name="fax">
                        </div>
                    </div>
                    <div class="row g-3 mt-1 ">
                        <div class="col-md-6">
                            <label for="contato" class="form-label">Contato</label>
                            <input type="text" class="form-control" id="contato" name="contato">
                        </div>
                            <div class="col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                    </div>
                    <div class="row g-3 mt-1 ">
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="receberEmails" name="receberEmails" checked>
                                <label class="form-check-label" for="receberEmails"> Receber e-mails de aviso sobre novas licitaçoes</label>
                            </div>    
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-12">
                            <label class="form-label d-block">Tipo de empresa</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="tipoEmpresa" id="microEmpresa" value="micro">
                                <label class="form-check-label" for="microEmpresa">MICRO EMPRESAS / EMPRESAS DE PEQUENO PORTE</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="tipoEmpresa" id="demaisFormas" value="demais">
                                <label class="form-check-label" for="demaisFormas">DEMAI FORMAS DE CONSTITUIÇAO</label>
                            </div>
                        </div>
                    </div>
                    <div class="row g-3 mt-3">
                        <div class="col-12 next-end">
                            <button type="submit" class="btn-btn-primary"> Salvar cadastro </button>
                        </div>
                        <div class="col-12">
                            <p class="small text-muted mb-0">ATENÇÃO: Este cadastro não substitui o cadastro de fornaecdeores do municipio de Sao sebastiao do Paraiso.</p>
                        </div>
                    </div>
                </div>
            </form>
        </div>
   </main>
   
    
</body>
</html>
